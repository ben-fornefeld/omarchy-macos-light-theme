include=~/.local/share/omarchy/default/mako/core.ini

# macOS 2026 "Tahoe" Light — Notification Center

text-color=#1C1C1E
border-color=#00000014
background-color=#FFFFFFCC
progress-color=#636366

default-timeout=5000
width=420
height=120
padding=16
margin=12
border-size=1
border-radius=16
outer-margin=10
anchor=top-right
layer=overlay
font=SF Pro Display 12

[urgency=low]
border-color=#00000014
text-color=#3C3C4399

[urgency=high]
border-color=#FF3B30
text-color=#1C1C1E

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false
