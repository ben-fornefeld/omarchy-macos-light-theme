# Notification toasts — see /usr/share/omarchy/default/themed/shell.toml.tpl.
# Frosted-glass card (translucent + blurred, hairline border) instead of a
# flat opaque panel, matching the terminal's translucency.
[notifications]
background       = "#FFFFFF"
background-alpha = 0.90
text             = "#1C1C1E"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 1
countdown        = "#636366"
