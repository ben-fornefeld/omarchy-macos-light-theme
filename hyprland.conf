# macOS 2026 "Tahoe" Light — Liquid Glass
# Derived from style-plan.json

# -- Colors ---------------------------------------------------------
# Metallic chromatic sheen shifted darker for visibility on white
# Graphite → slate → graphite, 135° diagonal sheen
$activeBorderColor   = rgba(8E8E9380) rgba(6E6E7380) rgba(4A4A4C66) 135deg
$inactiveBorderColor = rgba(00000012)
$shadowActive        = rgba(00000033)
$shadowInactive      = rgba(0000001C)

# -- General --------------------------------------------------------
general {
    gaps_in = 10
    gaps_out = 18
    border_size = 1

    col.active_border   = $activeBorderColor
    col.inactive_border = $inactiveBorderColor

    resize_on_border = true
    extend_border_grab_area = 12
    allow_tearing = false
    layout = dwindle
}

# -- Group (tabs) --------------------------------------------------
group {
    col.border_active   = $activeBorderColor
    col.border_inactive = $inactiveBorderColor

    groupbar {
        font_family = SF Pro Display
        font_size = 11
        height = 24
        gaps_in = 4
        gaps_out = 0
        rounding = 10
        rounding_power = 4.0
        text_color = rgba(1C1C1EEE)
        col.active   = rgba(8E8E9366) rgba(6E6E7366) 90deg
        col.inactive = rgba(0000000F)
        gradients = true
    }
}

# -- Decoration (Liquid Glass) -------------------------------------
decoration {
    rounding = 12
    rounding_power = 4.0

    active_opacity = 0.98
    inactive_opacity = 0.93
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 3
        ignore_opacity = true
        new_optimizations = true
        xray = false
        noise = 0.02
        contrast = 1.05
        brightness = 1.05
        vibrancy = 0.20
        vibrancy_darkness = 0.0
    }

    shadow {
        enabled = true
        range = 40
        render_power = 3
        ignore_window = true
        color = $shadowActive
        color_inactive = $shadowInactive
        offset = 0 12
    }
}

misc {
    background_color = rgb(FFFFFF)
}

# -- Animations (same Apple-style springs as dark variant) ---------
animations {
    enabled = yes

    bezier = standard,  0.32, 0.72, 0.00, 1.00
    bezier = swiftOut,  0.40, 0.00, 0.20, 1.00
    bezier = swiftIn,   0.40, 0.00, 1.00, 1.00
    bezier = smooth,    0.23, 1.00, 0.32, 1.00
    bezier = snappy,    0.22, 1.00, 0.35, 1.00
    bezier = liquid,    0.20, 0.80, 0.20, 1.20
    bezier = macspring, 0.18, 1.08, 0.35, 1.06
    bezier = overshoot, 0.13, 0.99, 0.29, 1.08
    bezier = fade,      0.50, 0.50, 0.75, 1.00

    animation = windows,           1, 3.5, macspring, slide
    animation = windowsIn,         1, 4.0, macspring, popin 88%
    animation = windowsOut,        1, 2.2, swiftIn,   popin 88%
    animation = windowsMove,       1, 3.2, snappy
    animation = border,            1, 5.0, smooth
    animation = borderangle,       1, 7.0, smooth
    animation = fade,              1, 3.0, fade
    animation = fadeIn,            1, 2.2, fade
    animation = fadeOut,           1, 1.8, fade
    animation = workspaces,        0, 4.0, smooth, slide
    animation = specialWorkspace,  0, 3.5, liquid, slidevert
    animation = layers,            1, 2.0, standard
    animation = layersIn,          1, 2.5, overshoot, popin 80%
    animation = layersOut,         1, 1.5, swiftIn,   popin 90%
    animation = fadeLayersIn,      1, 2.0, fade
    animation = fadeLayersOut,     1, 1.6, fade
}

# -- Blur layers (menu bar, launcher, notifications) ---------------
layerrule {
    name = macos-2026-light-waybar
    blur = on
    ignore_alpha = 0.2
    match:namespace = waybar
}
layerrule {
    name = macos-2026-light-walker
    blur = on
    ignore_alpha = 0.2
    match:namespace = walker
}
layerrule {
    name = macos-2026-light-notifications
    blur = on
    ignore_alpha = 0.2
    match:namespace = notifications
}
layerrule {
    name = macos-2026-light-swayosd
    blur = on
    ignore_alpha = 0.2
    match:namespace = swayosd
}
layerrule {
    name = macos-2026-light-logout
    blur = on
    match:namespace = logout_dialog
}
layerrule {
    name = macos-2026-light-hyprpicker
    blur = on
    match:namespace = hyprpicker
}

# -- Terminals: translucent so the blur shows through --------------
windowrule = opacity 0.82 0.75, match:tag terminal
